[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MaintAutopilot"
version = "0.1.0"
description = "Maintenance Autopilot V2.5 on Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore>=1.9.1",
    "botocore[crt]>=1.35.0",
    "strands-agents==1.52.0",
    "boto3==1.43.72",
    "pydantic==2.13.4",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
